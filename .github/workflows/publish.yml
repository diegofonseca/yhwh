name: Publish to npm

# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed.
# Configure it at https://www.npmjs.com/package/yhwh/access → Trusted Publisher
# (user: diegofonseca, repository: yhwh, workflow: publish.yml).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets GitHub prove its identity to npm (OIDC) and sign provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --access public
